name: Runtime integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  database-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: loadfinder
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: loadfinder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U loadfinder -d loadfinder"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://loadfinder:integration@localhost:5432/loadfinder
      INTEGRATION_DATABASE_URL: postgresql://loadfinder:integration@localhost:5432/loadfinder
      INTEGRATION_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Initialize clean schema
        run: npm run migrate
      - name: Verify repeatable migrations
        run: npm run migrate
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
