name: LoadFinder Source Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "backend/**"
      - "ci/**"
      - ".github/workflows/source-preflight.yml"
  pull_request:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository preflight
        run: |
          if [ -f ci/verify_project.py ]; then
            python ci/verify_project.py
          elif [ -f ci/verify.sh ]; then
            bash ci/verify.sh
          else
            echo "::error::No repository preflight script found."
            exit 1
          fi
