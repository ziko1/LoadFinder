name: LoadFinder Android Build

on:
  workflow_dispatch:

# The automatic debug build and unit tests live in ci.yml. Use this manual
# workflow when a downloadable debug APK is needed, without a second push build.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify project entrypoint
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/app/build.gradle.kts
          test -f app/app/src/main/AndroidManifest.xml
          test -x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loadfinder-debug-apk
          retention-days: 7
          path: android/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit-test reports
        uses: actions/upload-artifact@v4
        with:
          name: loadfinder-unit-test-reports
          retention-days: 7
          path: android/app/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
